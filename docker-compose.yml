services:
  backend:
    build:
      context: ./backend-django
      dockerfile: Dockerfile
    container_name: estacionamento-backend
    environment:
      DB_PATH: /data/db.sqlite3
      TZ: America/Sao_Paulo
    volumes:
      - sqlite_data:/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/dashboard', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: estacionamento-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlite_data:
